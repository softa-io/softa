# bash: docker network create shared-net
networks:
  shared-net:
    name: shared-net

# json-file does not rotate by default — a long-running dev stack will fill the
# disk. Applied to every service below.
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:

  redis:
    image: redis:8.4.0-alpine
    <<: *logging
    command: redis-server --requirepass admin
    networks:
      - shared-net
    ports:
      - 127.0.0.1:6379:6379

  postgres:
    image: postgres:18.6
    networks:
      - shared-net
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=hcm
    volumes:
      - ~/data/postgres-data:/var/lib/postgresql
