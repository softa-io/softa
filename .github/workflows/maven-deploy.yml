name: Deploy Maven packages (GitHub Packages + Maven Central)
# Deploy Maven packages to both GitHub Packages and Maven Central upon new release/tag.
#
# Strategy:
#   1) Resolve version from tag / release / manual input.
#   2) If main already has the target version → deploy directly from main.
#   3) Otherwise → create release branch, bump versions, deploy from that branch,
#      and only after deploy succeeds → create PR, merge it, clean up.
#   This guarantees main is never polluted by a failed deploy.
#   4) Deploy to Maven Central first, then GitHub Packages. Central validates the
#      whole bundle before publishing, so a failed Central deploy leaves nothing
#      published anywhere and the same version can simply be re-run.

on:
  push:
    tags:
      - "v*"
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version, e.g. 1.2.3 (optional; used when no tag)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: central

    steps:
      # ──────────────────────────────────────────────────────────
      # 1. Checkout & resolve version
      # ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          v="${{ inputs.version }}"
          if [[ -z "$v" ]]; then
            ref="${GITHUB_REF:-}"
            if [[ "$ref" == refs/tags/v* ]]; then
              v="${ref#refs/tags/v}"
            fi
          fi
          if [[ -z "$v" ]]; then
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          fi

          if [[ -z "$v" ]]; then
            echo "Unable to resolve version. Provide workflow_dispatch input 'version' or use a v* tag." >&2
            exit 1
          fi

          if [[ ! "$v" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid version '$v'. Expected digits and dots, e.g. 1.2.3" >&2
            exit 1
          fi

          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "branch=release/$v" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # setup-java's `cache: maven` keys on the hash of every pom.xml and sets no
      # restore-keys; every release bumps every pom.xml, so it never hit. Restore the
      # newest cache by prefix instead. The post step saves a new one when the job
      # succeeds (the last step drops this release's own io/softa artifacts first).
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Maven 3.10.0 (default on ubuntu-latest since image 20261004) leaves
      # maven-metadata-local.xml in central-publishing-maven-plugin's staging dir,
      # and Central Portal rejects the bundle with
      # "Bundle has content that does NOT have a .pom file".
      # Keep Maven on 3.9.x until the plugin handles Maven 3.10:
      # https://github.com/mavenplugins/central-publishing-maven-plugin/issues/79
      # The distribution is fetched from Maven Central, much faster than archive.apache.org.
      - name: Set up Maven 3.9.16 (pinned)
        shell: bash
        env:
          MAVEN_VERSION: "3.9.16"
        run: |
          set -euo pipefail
          base="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"
          tarball="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          expected="$(curl -fsSL --retry 3 "$base/$tarball.sha512" | awk '{print $1}')"
          [[ -n "$expected" ]] || { echo "Empty sha512 for $tarball" >&2; exit 1; }
          echo "$expected  $RUNNER_TEMP/$tarball" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" -v

      # ──────────────────────────────────────────────────────────
      # 2. Check whether main already has target version
      # ──────────────────────────────────────────────────────────
      - name: Check whether main already has target version
        id: mainver
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

          # The root pom declares its version literally, so read it straight from git
          # rather than running Maven (and downloading maven-help-plugin) in a worktree.
          v_main=$(git show origin/main:pom.xml | python3 -c 'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.stdin).getroot().findtext("{http://maven.apache.org/POM/4.0.0}version") or "")')

          if [[ -z "$v_main" ]]; then
            echo "Unable to read project.version from origin/main:pom.xml" >&2
            exit 1
          fi

          echo "main_version=$v_main" >> "$GITHUB_OUTPUT"

          if [[ "$v_main" == "${{ steps.version.outputs.version }}" ]]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "✅ Main is already at version $v_main; will deploy directly from main."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Main version is $v_main, target is ${{ steps.version.outputs.version }}; will create release branch."
          fi

      # ──────────────────────────────────────────────────────────
      # 3a. Fast path: main already at target version → checkout main
      # ──────────────────────────────────────────────────────────
      - name: Checkout main (already at target version)
        if: steps.mainver.outputs.already == 'true'
        shell: bash
        run: |
          git checkout origin/main

      # ──────────────────────────────────────────────────────────
      # 3b. Slow path: create release branch & bump versions
      # ──────────────────────────────────────────────────────────
      - name: Create release branch and bump versions
        if: steps.mainver.outputs.already == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B "${{ steps.version.outputs.branch }}" "origin/main"

          chmod +x ./upgrade-versions.sh
          ./upgrade-versions.sh "${{ steps.version.outputs.version }}"

          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "chore(release): bump version to ${{ steps.version.outputs.version }} [skip ci]"
          else
            echo "No changes after version bump; continuing."
          fi

          git push -u origin "${{ steps.version.outputs.branch }}" --force

      # ──────────────────────────────────────────────────────────
      # 4. GPG + Maven settings (needed for deploy)
      # ──────────────────────────────────────────────────────────
      - name: Import GPG key
        shell: bash
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --yes --import
          gpg --list-secret-keys --keyid-format=long || true

      - name: Configure Maven settings.xml
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <!-- For GitHub Packages (distributionManagement id = github) -->
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>

              <!-- For Sonatype Central Portal (publishingServerId = central) -->
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML

      # ──────────────────────────────────────────────────────────
      # 5. Build & Deploy (from current branch: main or release/*)
      # ──────────────────────────────────────────────────────────
      # -T 1C: modules build in parallel along the reactor graph, one thread per core.
      - name: Build & verify
        shell: bash
        run: |
          mvn -B -ntp -T 1C -DskipTests=false verify

      # Central first: its bundle is validated as a whole before anything is
      # published, so a failure here leaves both registries untouched.
      # Single-threaded on purpose: the plugin bundles and uploads at the last
      # publishable module in reactor order, and under -T modules finish in no fixed order.
      # Tests already ran above, so neither the test sources nor coverage are rebuilt.
      - name: Deploy to Maven Central (Central Portal)
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -ntp -Dmaven.test.skip=true -Djacoco.skip=true -Pcentral deploy

      # GitHub Packages serves the release right away, while Central takes a few
      # minutes after validation before new files can be pulled. The pom, jar and
      # sources go here: IDEs fetch sources from here too, and a lookup that misses
      # before Central has them is not retried for a day. Javadoc and signatures are
      # left to Central. -T 4 uploads modules in parallel, since Maven 3.9 uploads one
      # file at a time.
      - name: Deploy to GitHub Packages (Maven Registry)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp -T 4 -Dmaven.test.skip=true -Djacoco.skip=true \
            -Dmaven.javadoc.skip=true -Dgpg.skip=true \
            -Pgithub deploy

      # ──────────────────────────────────────────────────────────
      # 6. Post-deploy: merge release branch into main (fire-and-forget)
      #    Only runs when we created a release branch (not fast-path).
      #    Deploy already succeeded, so merging is safe.
      # ──────────────────────────────────────────────────────────
      - name: Create PR and merge into main
        if: steps.mainver.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ steps.version.outputs.branch }}"
          version="${{ steps.version.outputs.version }}"

          title="chore(release): $version"
          body="Automated release PR — bumps Maven module versions to $version.

          Deploy to GitHub Packages and Maven Central succeeded; merging version bump into main."

          # Create PR (or reuse existing one)
          url=$(gh pr create \
            --head "$branch" \
            --base "main" \
            --title "$title" \
            --body "$body" \
            2>/dev/null || true)

          if [[ -z "$url" ]]; then
            url=$(gh pr view "$branch" --json url -q .url 2>/dev/null || true)
          fi

          if [[ -z "$url" ]]; then
            echo "⚠️  No PR created/found (possibly no diff). Skipping merge."
            exit 0
          fi

          echo "PR: $url"

          # Merge immediately (squash). Deploy already succeeded so this is safe.
          # Falls back to auto-merge if branch protection blocks direct merge.
          gh pr merge --squash --delete-branch "$url" || {
            echo "⚠️  Direct merge failed; enabling auto-merge instead."
            gh pr merge --auto --squash --delete-branch "$url" || true
          }

      - name: Clean up release branch (fallback)
        if: steps.mainver.outputs.already == 'false' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # If the PR merge already deleted the branch, this is a no-op.
          git push origin --delete "${{ steps.version.outputs.branch }}" 2>/dev/null || true

      # The cache post step saves ~/.m2/repository after this; leave this release's own
      # artifacts out so the cache does not grow by one softa version per release.
      - name: Drop softa artifacts from the Maven cache
        shell: bash
        run: rm -rf ~/.m2/repository/io/softa
