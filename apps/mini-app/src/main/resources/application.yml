spring:
  application:
    name: mini-app
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cache:
    redis:
      # Global default expiration period for redis cache
      time-to-live: 30d
  jackson:
    time-zone: UTC
  jmx:
    # Turn off JVM remote calls
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 80
  shutdown: graceful
  servlet:
    context-path: /api/mini
  tomcat:
    max-connections: 10000
    accept-count: 600
    max-swallow-size: 20MB

# CosId 5: slots are leased in Redis through the context's RedisConnectionFactory; the default
# generator keeps CosId 3's snowflake layout (epoch 2019-12-24T16:00:00Z, 41/10/12 bits).
cosid:
  namespace: ${spring.application.name}
  stores:
    redis:
      type: redis
  machine:
    leased:
      store: redis
  generators:
    default:
      strategy: snowflake

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: false

logging:
  level:
    root: info

springdoc:
  writer-with-order-by-keys: true
  api-docs:
    # Turn off in production environment
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tagsSorter: alpha
    operations-sorter: alpha
    enabled: true
