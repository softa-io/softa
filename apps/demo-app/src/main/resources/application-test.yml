debug: false
system:
  name: Demo Application
  app-code: demo-app
  # Public origins. site-url: where the frontend pages live (the Next dev server), the base of every
  # user-facing deep link. api-url: this app's own origin, set only because it differs locally (port
  # 80); a same-origin deployment leaves it blank and it falls back to site-url.
  site-url: http://localhost:3000
  api-url: http://localhost
  metadata:
    public-key:
security:
  encryption:
    password: 12345678
    algorithm: AESEncryption
  # Signs the keys in FileInfo.url (softa-web README, File keys). Required, the same on every
  # instance. This value is for local development only: anywhere else set SECURITY_FILE_KEY_SECRET
  # (openssl rand -base64 48), which overrides it.
  file-key:
    secret: dev-only-file-open-key-secret-do-not-use-anywhere-else

